# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: lojaecommerce
type: application
framework:
  name: SAPUI5
  version: 1.136.7
  libraries:
    - name: sap.f
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.ushell
    - name: themelib_sap_horizon
    - name: themelib_sap_horizon_dark
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        backend:
          - path: /sap
            url: https://6449ad14-b137-4a27-8017-6421c2c4f0b0.abap.us10.hana.ondemand.com
            client: '100'
            authenticationType: reentranceTicket
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata4/sap/zui_pc_estoque_o4/srvd/sap/zui_pc_estoque/0001
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
            resolveExternalServiceReferences: false
          - urlPath: /sap/opu/odata4/sap/zui_pc_pedidos_compras_o4/srvd/sap/zui_pc_pedidos_compras/0001
            metadataPath: ./webapp/localService/ordersService/metadata.xml
            mockdataPath: ./webapp/localService/ordersService/data
            generateMockData: false
            resolveExternalServiceReferences: false
          - urlPath: /sap/opu/odata4/sap/zui_pc_clientes_o4/srvd/sap/zui_pc_clientes/0001
            metadataPath: ./webapp/localService/customersService/metadata.xml
            mockdataPath: ./webapp/localService/customersService/data
            generateMockData: false
            resolveExternalServiceReferences: false
        annotations: []
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
