# Deploy no ABAP Repository do SAP BTP ABAP Environment (npm run deploy):
# cria/atualiza a aplicação BSP ZPC_ANALISE_R e o IAM App ZPC_ANALISE_R_UI5R no pacote ZAVBS_PC_COMMON.
# Pacotes do software component ZLOCAL (trial) não usam transporte.
# Lido por @sap-ux/deploy-tooling (mesma configuração `deploy-to-abap` dos apps UI5).

specVersion: "4.0"
metadata:
  name: analisecomprasreact
type: application
builder:
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        ignoreCertErrors: false
        target:
          url: https://6449ad14-b137-4a27-8017-6421c2c4f0b0.abap.us10.hana.ondemand.com
          client: "100"
          authenticationType: reentranceTicket
        app:
          name: ZPC_ANALISE_R
          description: Análises de Compras (React)
          package: ZAVBS_PC_COMMON
          transport: ""
        exclude:
          - /test/
