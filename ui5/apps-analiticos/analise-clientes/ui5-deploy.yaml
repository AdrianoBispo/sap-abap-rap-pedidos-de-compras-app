# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
# Deploy no ABAP Repository do SAP BTP ABAP Environment (npm run deploy):
# cria/atualiza a aplicação BSP ZPC_ANL_CLIENTE e o IAM App ZPC_ANL_CLIENTE_UI5R no pacote ZAVBS_PC_CLIENTES (variável SAP_PACKAGE_CLIENTES do .env).
# Sistema, mandante, pacote e transporte vêm do ui5/.env (ver ui5/.env.example);
# pacotes do software component ZLOCAL (trial) não usam transporte (SAP_TRANSPORT vazio).

specVersion: "4.0"
metadata:
  name: analiseclientes
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        ignoreCertErrors: false
        target:
          url: ${SAP_URL}
          client: '${SAP_CLIENT}'
          authenticationType: ${SAP_AUTH_TYPE:-reentranceTicket}
        app:
          name: ZPC_ANL_CLIENTE
          description: Análise de Clientes
          package: ${SAP_PACKAGE_CLIENTES}
          transport: "${SAP_TRANSPORT}"
        exclude:
          - /test/
