# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
# Execução local contra o SAP BTP ABAP Environment (proxy para /sap).
# Troque a URL do backend com:  npm run set-backend -- https://<id>.abap.<região>.hana.ondemand.com
# (script na pasta ui5/). No SAP Business Application Studio, use "destination: <nome>" no lugar de url.

specVersion: "4.0"
metadata:
  name: zpc.clientes
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: https://SEU-SISTEMA.abap.us10.hana.ondemand.com
            authenticationType: reentranceTicket
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
          intent:
            object: ZPCCliente
            action: manage
